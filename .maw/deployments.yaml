schema_version: 2
deployment_targets: []

# 一个物理服务器可被多个部署目标引用；组件范围属于部署目标，不属于服务器资产。
# 新增组件不会自动进入任何生产目标，必须显式加入 component_refs。
# 示例：
# deployment_targets:
#   - key: customer-a-staging
#     name: 客户 A 线上验证
#     environment_key: staging
#     environment_role: staging
#     server_ref: mawresource://server/customer-a-staging
#     subproject_ref: customer-a
#     component_refs: [customer-a-api, customer-a-web]
#     scope_mode: exclusive
#     deployment_profile_ref: ""
#     access_profile_ref: ""
#     enabled: true
#     policy:
#       approval_required: false
#       backup_required: true
#       rollback_required: true
#       health_freshness_seconds: 900
