# Fresh projects contain shared Seed governance only; no source-project capability facts.
schema_version: 1
capability_registry:
  purpose: "Machine-readable reusable capability index for technical-map lookup, audit, and AI preconditions."
  docs_root: docs/capabilities
  detail_template: docs/capabilities/_template/capability.md
  extraction_tool: ops/scripts/extract-project-metadata.py
  check_script: ops/scripts/check-technical-map.sh
  status_values:
    - candidate
    - stable
    - deprecated
    - blocked
  type_values:
    - api
    - service
    - base_class
    - component
    - script
    - governance_protocol
    - data_contract
    - integration
  origin_values:
    - seed_repository
    - derived_project_custom
    - candidate_for_seed_repository
    - unknown_legacy
  promotion_policy:
    candidate_when: "A capability is implemented in one module and likely reusable by another module."
    stable_when: "The capability is reused by another module, or the owner confirms it as a shared capability."
    module_reference_policy: "Module dossiers reference capability_key; capability facts remain in the capability index and docs."
  closeout_metadata_key: capability_map_update_status

capabilities:
  - key: project-governance-dialogue
    name: 项目权威问答与档案闭环
    type: governance_protocol
    status: candidate
    origin: seed_repository
    owner_module: ''
    owner_component: ''
    related_app_keys: []
    summary: 以同源版本记录连接AI理解、人工确认、待回应问题、消费回执与固定档案。
    implementation_paths:
    - ops/scripts/maw_governance/
    - ops/scripts/manage-project-governance.py
    - docs/ai-coding/project-governance.md
    - docs/capabilities/project-governance-dialogue.md
    provided_contracts:
    - mawflow.project_governance.v1
    - mawflow.document_source.v3
    - mawflow.document_work_event.v2
    reusable_entrypoints:
    - mawflow project governance
    - mawflow_seed_kit.governance.project_governance
    consumed_by_modules: []
    validation:
    - python3 -m pytest -q tests/test_project_governance.py tests/test_document_source_capture.py
    last_verified_commit: ''
  - key: development-resource-coordination
    name: 对话开发资源协调
    type: governance_protocol
    status: candidate
    origin: seed_repository
    owner_module: not_identified
    owner_component: ''
    related_app_keys: []
    summary: 新鲜设备状态与工作台CLI回读、按需环境及同用户跨项目重任务串行。
    implementation_paths:
    - docs/ai-coding/development-resources.md
    - ops/scripts/development-resources.py
    provided_contracts:
    - mawflow.development_resources.v1
    - mawflow.development_resource_policy.v1
    reusable_entrypoints:
    - python3 ops/scripts/development-resources.py check
    consumed_by_modules: []
    validation:
    - python3 ops/scripts/development-resources.py check
    last_verified_commit: ''

  - key: workspace-libraries
    name: 账号共享与项目资源及经验库
    type: governance_protocol
    status: candidate
    origin: seed_repository
    owner_module: not_identified
    owner_component: ''
    related_app_keys: []
    summary: 安全索引发现、固定版本重新鉴权及本地增量同步；正文为数据，账号内容不进入Seed。
    implementation_paths: [docs/ai-coding/workspace-libraries.md, docs/capabilities/workspace-libraries.md]
    provided_contracts: [mawflow.resources.search.v1, mawflow.resources.resolve.v1]
    reusable_entrypoints: [mawflow resources search, mawflow resources resolve, maw.resources.search, maw.resources.resolve]
    consumed_by_modules: []
    validation: [python3 -m pytest tests/test_workspace_library_protocol.py -q]
    last_verified_commit: ''

  - key: stage-standards-governance
    name: 六阶段规范与任务证据治理
    type: governance_protocol
    status: stable
    origin: seed_repository
    owner_module: not_identified
    owner_component: ''
    related_app_keys: []
    summary: 按阶段、项目适用条件和任务深度选择权威规范；检查目录、声明、空套件与证据失效，原任务/测试/发布保留各自主账。
    implementation_paths:
    - ops/scripts/manage-project-standards.py
    - docs/standards/README.md
    - .maw/standards.yaml
    provided_contracts:
    - mawflow.standards_catalog.v1
    - mawflow.standard_task_snapshot.v1
    reusable_entrypoints:
    - python3 ops/scripts/manage-project-standards.py context
    - python3 ops/scripts/manage-project-standards.py check
    - python3 ops/scripts/manage-project-standards.py validate-task
    consumed_by_modules: []
    validation:
    - python3 -m pytest -q tests/test_stage_standards.py
    - python3 ops/scripts/manage-project-standards.py check
    last_verified_commit: ''

  - key: incremental-release-all
    name: 发布全部与逐组件成功提交基线
    type: script
    status: candidate
    origin: seed_repository
    owner_module: template-release-governance
    owner_component: ''
    related_app_keys: []
    summary: 发布全部在显式部署目标范围按组件上次成功Git提交筛选；部分成功仅更新成功者，失败与跳过保留基线。
    implementation_paths:
    - ops/scripts/plan-release-components.py
    - docs/capabilities/incremental-release-all.md
    - docs/ai-coding/release-closeout.md
    provided_contracts:
    - 每个environment/deployment_target/app_key独立成功提交与范围指纹
    - 多组件successful-component显式成功声明与原子状态写入
    reusable_entrypoints:
    - '#发布全部'
    - python3 ops/scripts/plan-release-components.py --all
    consumed_by_modules: []
    validation:
    - tests/test_plan_release_deployment_targets.py
    - docs/template-migrations/20261015-incremental-release-all.md
    last_verified_commit: ''

  - key: optional-runtime-health-contract
    name: 可选项目运行健康声明
    type: governance_protocol
    status: candidate
    origin: seed_repository
    owner_module: ''
    owner_component: ''
    related_app_keys: []
    summary: 仅提供原生或独立采集的可选协议；未接入不扣分，不安装服务或访问环境。
    implementation_paths:
      - docs/capabilities/runtime-health-contract.md
      - ops/scripts/check-runtime-health.py
      - .maw/schemas/runtime-health.schema.json
    provided_contracts: [mawflow.runtime_health_contract.v1, mawflow.runtime_health.v1]
    reusable_entrypoints: [python3 ops/scripts/check-runtime-health.py]
    consumed_by_modules: []
    validation: [python3 ops/scripts/check-runtime-health.py --format json]
    last_verified_commit: ''

  - key: configuration-repair
    name: 配置诊断与修复
    type: governance_protocol
    status: candidate
    origin: seed_repository
    owner_module: ''
    owner_component: ''
    related_app_keys: []
    summary: 工作台、Agent与CLI同源追踪配置声明、引用和实际消费者，按授权预览修复并分层回读。
    implementation_paths:
      - docs/ai-instructions/instructions/configuration-repair.md
      - docs/ai-instructions/templates/configuration-repair-report.md
    provided_contracts: [TINST-045]
    reusable_entrypoints: ['#配置诊断', '#配置修复', '#T044']
    consumed_by_modules: []
    validation: [tests/test_configuration_repair_distribution.py]
    last_verified_commit: ''
  - key: task-lifecycle-resource-closeout
    name: 任务生命周期与资源收尾
    type: governance_protocol
    status: stable
    origin: seed_repository
    owner_module: ''
    owner_component: ''
    related_app_keys: []
    summary: 跨工具任务定界、执行、验证、异常恢复和资源收尾；复用原任务快照和主账。
    implementation_paths:
    - docs/ai-coding/task-lifecycle.md
    - .maw/schemas/task-lifecycle.schema.json
    - ops/scripts/manage-project-standards.py
    provided_contracts:
    - mawflow.task_lifecycle.v1，可选任务快照扩展；声明校验不代表实际回收或验收。
    reusable_entrypoints:
    - python3 ops/scripts/manage-project-standards.py validate-task --input <task-snapshot>
    consumed_by_modules: []
    validation:
    - python3 -m pytest tests/test_task_lifecycle.py -q
    last_verified_commit: ''
