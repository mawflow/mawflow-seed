schema_version: 3
entry_key: mawflow_seed_agent_entry
status: active
purpose: 面向本地与网页 Agent 的通用入口；专用入口从共享契约生成，保留项目自有规则。
product_positioning:
  short_name: Mawflow Seed
  category: open_source_ai_project_navigation_system
  human_summary: MAWflow Seed 是安装在 AI 编程工作目录里的开源 AI 项目导航系统和工作目录辅助层。
  i18n:
    ai:
      en-US: MAWflow Seed is an open source AI project navigation system and workdir
        assistant for local AI coding tools.
startup:
  recommended_order:
  - AI_START_HERE.md
  - .maw/agent-entry.yaml
  - .maw/agent-context.md
  - .maw/project.yaml
  - .maw/components.yaml
  - .maw/modules.yaml
  task_scoped_followups:
  - docs/ai-instructions/README.md
  - docs/modules/README.md
  - docs/capabilities/README.md
  - docs/project-signals/README.md
  read_policy:
    docs_are_on_demand: true
    prompts_are_manual_only: true
    archive_is_not_default_context: true
facts:
  project: .maw/project.yaml
  subprojects: .maw/subprojects.yaml
  code_sources: .maw/code-sources.yaml
  deployment_targets: .maw/deployments.yaml
  components: .maw/components.yaml
  modules: .maw/modules.yaml
  runtime: .maw/app-runtime.yaml
  policies: .maw/policies.yaml
  interaction: .maw/interaction.yaml
  standards: .maw/standards.yaml
protected_paths:
  never_commit:
  - .local/**
  - .maw/*.local.yaml
  - .maw/*.local.yml
  - .ssh/**
  - runtime/**
  - workspaces/**
  - artifacts/**
  read_only_by_default:
  - prompts/**
  - docs/archive/**
  - ops/**/payload/**
  secrets:
    forbidden_in_public_outputs:
    - real tokens
    - passwords
    - SSH private keys
    - production connection strings
    - unredacted customer data
    - provider API keys
  manual_only:
  - prompts/**
  - docs/archive/**
execution_contract:
  before_editing:
  - identify repository role
  - identify module_key or module_candidate
  - identify owned paths and blocked paths
  - choose validation commands
  during_work:
  - keep edits scoped
  - preserve project facts over template defaults
  - prefer existing project patterns
  - update related docs when boundaries change
  closeout:
    release_policy: docs/ai-coding/release-closeout.md
    required_human_fields:
    - changes
    - validation
    - unverified
    - risks
    - release_impact
    - next_step
    stable_metadata:
    - module_key
    - module_dossier_updated
    - hit_code_components
    - release_update_status
    - local_environment_status
    - memory_update
    - local_update
    - task_lifecycle_status
    - resource_cleanup_status
  task_lifecycle:
    policy: docs/ai-coding/task-lifecycle.md
    schema: mawflow.task_lifecycle.v1
    snapshot_extension: mawflow.standard_task_snapshot.v1.lifecycle
    checker: python3 ops/scripts/manage-project-standards.py validate-task --input
      <task-snapshot>
    stages:
    - scoped
    - preparing
    - executing
    - verifying
    - closing
    - ended
    closeout_fields:
    - task_lifecycle_status
    - resource_cleanup_status
    existing_authorization_persists: true
    task_master_unchanged: true
    read_only_no_project_writes: true
    live_cleanup_enforcement: executor_capability_required
    automatic_cleanup_without_receipt: pending_automatic
    preferred_protocol_revision: 2
  development_resources:
    device_policy_schema: mawflow.development_resource_policy.v1
    device_policy_location: user_home/.local/config/maw-development-resources.json
    host_capability: host.development_resources
    docker_runner: python3 ops/scripts/development-resources.py run --workload docker
      --execute -- <authorized-command>
    policy: docs/ai-coding/development-resources.md
    checker: python3 ops/scripts/development-resources.py check
    heavy_runner: python3 ops/scripts/development-resources.py run --execute -- <authorized-command>
    checkpoints:
    - task_start
    - session_resume
    - service_start
    - before_heavy_job
    - after_heavy_job
    - milestone
    communication: capability_negotiated_cli_or_authorized_local_mcp
    default_heavy_job_limit: 1
    coordination_scope: same_user_same_device
    unavailable_cli: project_files_fallback
    read_only_check_no_writes: true
  document_source_capture:
    schema: mawflow.document_source.v1
    policy: docs/ai-coding/document-source-capture.md
    directory: docs/intake
    tool: ops/scripts/capture-document-source.py
    read_only: deferred_read_only
    closeout_field: document_source_capture
    preferred_schema: mawflow.document_source.v2
    event_schema: mawflow.document_work_event.v1
    event_template: docs/intake/event-template.json
    record_action: record-event
    closeout_check: check-event
    automatic_triggers:
    - clarification
    - decision
    - correction
    - progress
    - blocked
    - verification
    - handoff
  update_notes:
    policy: docs/ai-coding/update-notes.md
    source: .maw/changes/*.yaml
    record_type: update_note
    command: python3 ops/scripts/generate-update-notes.py
    default_limit: 100
    trigger: verified_user_visible_change
    append_only: true
    read_only: deferred_read_only
    closeout_field: update_notes_status
  standards:
    policy: docs/standards/README.md
    catalog: .maw/standards.yaml
    checker: python3 ops/scripts/manage-project-standards.py check
    context: python3 ops/scripts/manage-project-standards.py context --phase <phase>
      --task-class <class> --task-kind <kind>
    read_policy: catalog_then_selected_authority_only
    authorization_granted: false
    legacy_missing: not_adopted_no_development_block
    execution_policy: docs/standards/execution-protocol.md
    execution_protocol: 1
    plan: python3 ops/scripts/manage-project-standards.py plan-task --input <task-snapshot>
    report: python3 ops/scripts/manage-project-standards.py report-task --input <task-snapshot>
tool_adapters:
  codex:
    file: AGENTS.md
    status: supported
    loader: instructions
  generic_ai:
    file: AI_START_HERE.md
    status: supported
    loader: manual
  claude:
    file: CLAUDE.md
    status: supported
    loader: import
  gemini:
    file: GEMINI.md
    status: supported
    loader: import
  cursor:
    file: AGENTS.md
    status: supported
    loader: instructions
  chatgpt_web:
    file: CHATGPT.md
    loader: repository_links
    status: supported
external_agent_skills:
  mawflow:
    protocol_version: 1
    minimum_skill_protocol_version: 1
    status: optional_supported
    required: false
    recommended_scope: user
    role: discovery_and_adapter
    project_local_authority: true
    project_files_remain_required: true
    compatibility_contract: docs/capabilities/agent-skill-integration.md
validation:
  doctor_checks:
  - AGENTS.md exists
  - AI_START_HERE.md exists
  - .maw/agent-entry.yaml exists
  - .maw/project.yaml exists
  - .maw/subprojects.yaml exists
  - .maw/code-sources.yaml exists
  - .maw/deployments.yaml exists
  - .maw/components.yaml exists
  - .maw/modules.yaml exists
  - .maw/app-runtime.yaml exists
  - .maw/policies.yaml exists
  - docs/README.md exists
  - ops validation entry exists
  boot_summary_fields:
  - project name
  - repository role
  - components
  - module index
  - protected paths
  - validation commands
  - closeout contract
agent_protocol_version: 1
task_routes:
  configuration_repair:
  - docs/ai-instructions/instructions/configuration-repair.md
  resource_libraries:
  - docs/ai-coding/workspace-libraries.md
  development:
  - docs/ai-coding/README.md
  review:
  - docs/ai-coding/coding-style.md
  delivery:
  - MAWFLOW_CLI.md
  - docs/ai-coding/project-workflow.md
  governance:
  - docs/standards/README.md
  - docs/ai-instructions/README.md
  standards:
  - docs/standards/README.md
  - .maw/standards.yaml
tool_preferences:
  rtk: optional_with_native_fallback
  mcp: optional
  skills: optional
git_policy:
  commit: project_policy
  push: project_policy
  mirror: project_policy
