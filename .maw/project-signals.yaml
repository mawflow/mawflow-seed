# Fresh projects contain shared Seed AI preconditions only; no source-project signals.
schema_version: 1
project_signal_registry:
  purpose: "Machine-readable human and AI hints for audits, dashboards, and development preconditions."
  docs_root: docs/project-signals
  detail_template: docs/project-signals/_template.md
  extraction_tool: ops/scripts/extract-project-metadata.py
  check_script: ops/scripts/check-technical-map.sh
  closeout_metadata_key: project_signal_update_status
  type_values:
    - todo
    - clarification
    - gap
    - scope_change
    - terminology_change
    - risk
    - audit_hint
    - ai_precondition
  status_values:
    - active
    - monitoring
    - resolved
    - superseded
    - ignored
  severity_values:
    - info
    - low
    - medium
    - high
    - critical
  audience_values:
    - human
    - ai
    - dashboard
    - reviewer
    - release_manager
  source_policy:
    todo_source: docs/planning/todos/active.md
    clarification_source: docs/ai-instructions/experience-candidates.md
    terminology_source: docs/ai-instructions/keyword-candidates.md
    execution_lesson_source: docs/ai-instructions/execution-lesson-candidates.md
    module_source: docs/modules/
    local_only_excluded: true
  ai_precondition_policy:
    - "Active or monitoring signals for AI or dashboard audiences should be read before related work."
    - "Signals reference TODO-ID, capability_key, module_key, and evidence paths instead of duplicating facts."

signals:
  - id: SIG-20261010-development-resources
    type: ai_precondition
    status: active
    severity: medium
    audience:
    - human
    - ai
    - reviewer
    title: 对话开发共享设备资源并回读本机通信
    human_summary: 开工与阶段检查消费实时资源及工作台CLI；重任务默认串行，旧项目等待自身升级。
    ai_preconditions:
    - 按 docs/ai-coding/development-resources.md 执行；历史采样和CLI存在均不能代替实时验证。
    - 只读不写入，资源工具不扩大服务控制或发布授权；无CLI时按项目文件继续。
    related_modules: []
    related_capabilities:
    - development-resource-coordination
    related_todos: []
    evidence_paths:
    - docs/ai-coding/development-resources.md
    - ops/scripts/development-resources.py
    owner_role: platform-engineering
    created_at: '2026-10-10'
    last_updated: '2026-10-10'
    resolution: ''
  - id: SIG-20261019-task-lifecycle
    type: ai_precondition
    status: active
    severity: medium
    audience:
    - human
    - ai
    - reviewer
    title: 任务执行结束与业务关闭、资源回收分别判断
    human_summary: 等待、失败、取消与交接也清点本任务资源；借用浏览器页面交还控制，自动收尾未回读不称已释放。
    ai_preconditions:
    - 开工、恢复、收尾读取任务生命周期权威；只读不落盘，不清理归属不明资源。
    related_modules: []
    related_capabilities:
    - task-lifecycle-resource-closeout
    related_todos: []
    evidence_paths:
    - docs/ai-coding/task-lifecycle.md
