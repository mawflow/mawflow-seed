schema_version: 1
rules_key: mawflow_seed_agent_rules
source: .maw/agent-entry.yaml
status: active
generation_policy:
  canonical_source: .maw/agent-entry.yaml
  generated_or_aligned_targets:
  - AGENTS.md
  - AI_START_HERE.md
  - CLAUDE.md
  - GEMINI.md
  - CHATGPT.md
  drift_policy: When tool-specific files disagree, preserve project-specific facts
    and update the adapter from .maw/agent-entry.yaml.
rules:
- id: load_project_facts_first
  severity: required
  summary: 读取项目事实后再执行任务。
  applies_to:
  - codex
  - claude
  - gemini
  - cursor
  - generic_ai
- id: preserve_target_project_facts
  severity: required
  summary: 模板默认值不能覆盖目标项目 README、code、app_key、发布配置、仓库映射、secrets 或模块档案。
  applies_to:
  - codex
  - claude
  - gemini
  - cursor
  - generic_ai
- id: protect_local_and_secret_paths
  severity: required
  summary: 不得提交本机资料、真实密钥、token、私钥、生产连接串、未脱敏日志或用户上传文件。
  applies_to:
  - codex
  - claude
  - gemini
  - cursor
  - generic_ai
- id: prompts_manual_only
  severity: required
  summary: prompts/** 是人工选择的一次性任务提示词库，不因关键词或扫描结果自动读取。
  applies_to:
  - codex
  - claude
  - gemini
  - cursor
  - generic_ai
- id: validate_and_closeout
  severity: required
  summary: 任务结束时说明变更、验证、未验证、风险、发布影响和下一步。
  applies_to:
  - codex
  - claude
  - gemini
  - cursor
  - generic_ai
- id: preserve_project_facts
  severity: required
  summary: 项目事实优先于模板默认值；不覆盖业务 README、源码、组件标识或既有规则。
- id: scope_work
  severity: required
  summary: 先定位模块、允许修改路径与禁止路径，只提交当前任务的改动。
- id: protect_secrets
  severity: required
  summary: 共享输出不得包含凭据值、私钥、客户隐私、本机绑定或未脱敏日志。
- id: manual_prompts
  severity: required
  summary: prompts、归档和运行产物只在用户明确指定且任务需要时读取。
- id: validate_evidence
  severity: required
  summary: 执行项目真实验证；分别说明实现、测试、部署与真人验收证据。
- id: respect_authorization
  severity: required
  summary: 沿用当前任务已有授权；发布、外部写入与破坏性操作按项目策略和实际授权执行。
- id: capture_document_sources
  severity: required
  summary: 需求澄清、用户决定、纠偏、关键发现和验证收口时，按 docs/ai-coding/document-source-capture.md 收录最小来源及回执；只读任务只输出待收录摘要，AI
    推断不得自动确认。
- id: capture_business_and_work_events
  severity: required
  summary: 获准修改的任务在澄清、决定、纠偏和阶段收口时自动执行来源事件收录与 check-event 回读；业务 key/scope 保持稳定，待确认不覆盖已确认，工作记录不替代任务主账。只读或禁记时不写入。
- id: record_project_update_notes
  severity: required
  summary: 获准修改且形成对使用者有意义的新增、优化、修复、安全或使用文档变化时，按 docs/ai-coding/update-notes.md 追加
    update_note 权威片段并生成最近100条、完整历史与云端分页；只读不落盘，开发、发布、验证和真人验收独立标注。
- id: consume_confirmed_project_answers
  severity: required
  summary: 支持项目口径协议时按 docs/ai-coding/project-governance.md 读取任务范围有效问答，并在获准修改任务记录精确版本消费回执；疑义、风险、冲突、待办和建议形成可回应问题，仅阻塞依赖动作。AI理解保持候选，人工精确确认才生效；档案实质修订映射回口径，不自动扩大授权。
- id: coordinate_development_resources
  severity: required
  summary: 本地对话开发开工、恢复及重任务前后按 docs/ai-coding/development-resources.md 检查资源和已装工作台/CLI；按需复用服务，同一用户跨项目重任务默认串行，离线回退项目文件，不自动安装、调参、停服务或上传会话。
- id: stage_standards_scoped_execution
  severity: required
  summary: 按docs/standards/README.md和规范目录选择六阶段及任务深度，只读命中权威；授权、模块边界、状态与证据独立。未采用/空测试/过期证据不称通过；规范快照不替代原任务、测试、发布或真人验收。

- id: task_lifecycle_and_resource_closeout
  severity: required
  summary: 按 docs/ai-coding/task-lifecycle.md 完成定界、准备、执行、验证、交付与资源收尾；失败、取消、等待、交接同样清点本任务资源，借用页面交还控制，临时标签按工具文档关闭，保留须有用途/归属/复查条件；待自动收尾、失败和未知不得称已释放，执行结束不等于业务验收关闭。

- id: record_public_execution_materials
  severity: required
  summary: 无人值守任务按task/run记录公开理解、假设、理由、调整和失败恢复；收口保留原始目标与验证依据，缺失如实提示，不采集隐藏推理，不由最终结果倒推理由。

- id: archive_explicit_document_outputs
  severity: required
  summary: 明确要求保存的方案、沉淀和交付文档按项目口径协议登记固定版本并回读；普通入档不依赖无关口径。用户原件默认受管本地保存，不进Git或自动分享；失败只续作登记。

- id: bind_release_version_before_execution
  severity: required
  summary: 采用版本节点协议后，每次发布在执行前绑定项目既有版本、候选、目标和明确变更成员；同请求复用节点，实际状态仍回读原发布系统，摘要失败不重跑部署。

- id: human_direct_governance_maintenance
  severity: required
  summary: 人工可直接新增、编辑和删除口径；写入绑定完整正文、范围、版本及预览，删除以停用修订退出有效阅读和AI上下文，保留历史与原引用，不由AI代替人工确认。

- id: browser_connection_recovery
  severity: required
  summary: 浏览器操作先按 docs/ai-coding/browser-connection.md 读取当前工具文档；用户指定优先，否则优先健康官方入口。按加载、发现、原生连接、网络与页面分层定位，JS重置不替代MCP重连；保留官方命令、权限、可信登记与连接上下文，真实开页/点击/刷新/截图后才称恢复，本机配置不传播。

- id: scope_client_memory_writes
  severity: required
  summary: Agent通过工具发起的工作区/用户级记忆、临时文件和来源记录同样受只读及owned_paths约束；不因属于工具自身流程或被Git忽略而豁免。发生冲突时报告并停止依赖写入，不删除旧记录或扩大权限。
