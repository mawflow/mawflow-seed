schema_version: 2
module_map_governance:
  protocol: docs/ai-instructions/instructions/module-map.md
  audit_root: docs/modules/_audits
  lifecycle_values: [active, stale, deprecated]
  doc_status_values: [confirmed, inferred, pending_confirm, stale, deprecated]
  confidence_values: [high, medium, low]
  # 新模块按 group/leaf/component/cross-cutting 建模；leaf 档案使用 changelog_path:
  # docs/changelogs/<module_key>.md，并维护 changelog_time、last_verified_commit、source_paths、
  # last_audit_id、module_map_score、route_index_coverage、api_owner_coverage、
  # detail_doc_coverage、traceability_coverage、stale_docs_count、orphan_docs_count、
  # missing_changelog_count；过期事实标记 stale/deprecated。
# 技术组件不是业务模块；模块必须依据真实业务边界另行建立。
modules: []
