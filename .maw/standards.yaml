  category: common
  primary_phase: initiation
  applies_to_phases: &id001
  - initiation
  - design
  - development
  - testing
  - deployment
  - delivery
  task_classes: &id002
  - small_change
  - iteration
  - formal_delivery
  task_kinds: &id003
  - read_only
  - modify
  - test
  - deploy
  - deliver
  trigger: 模板创建、升级或发布
  authority: docs/standards/general.md
  owner: project-owner
  requirement: required
  deliverables:
  - source_route_receipt
  validation:
  - 核验仓库身份、绑定或公共稳定版
  enforcement: manual
  version: 1.1.0
  exception_policy: 沿用已确认精确例外；变化记录依据、范围、责任和有效期，不能由工具授予。
  reuse_policy: 输入版本、环境、范围和证据仍有效时复用；变化只重验受影响部分。
  applicability:
    any_facts:
    - project_setup
