schema_version: 2
upgrade_policy:
  mode: explicit_preview
  compatibility_window: none_before_public_launch
  require_clean_worktree: true
  require_human_confirmation: true
  rollback_required: true
  source_route_policy: "只有经仓库身份核验的主仓使用已绑定内部 Seed 独立 Git 目录的已提交固定 commit；其它所有派生项目（包括内部开发仓）使用经验证的公共稳定 tag 与同版本 Kit。本机覆盖、用户参数和历史来源字段不能改变路线；来源未知、证据冲突或旧基线不可达时保留原状态，先预览来源迁移。"
