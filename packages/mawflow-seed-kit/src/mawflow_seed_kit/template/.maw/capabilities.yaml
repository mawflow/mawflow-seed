# Fresh projects contain shared Seed governance only; no source-project capability facts.
schema_version: 1
capability_registry:
  purpose: "Machine-readable reusable capability index for technical-map lookup, audit, and AI preconditions."
  docs_root: docs/capabilities
  detail_template: docs/capabilities/_template/capability.md
  extraction_tool: ops/scripts/extract-project-metadata.py
  check_script: ops/scripts/check-technical-map.sh
  status_values:
    - candidate
    - stable
    - deprecated
    - blocked
  type_values:
    - api
    - service
    - base_class
    - component
    - script
    - governance_protocol
    - data_contract
    - integration
  origin_values:
    - seed_repository
    - derived_project_custom
    - candidate_for_seed_repository
    - unknown_legacy
  promotion_policy:
    candidate_when: "A capability is implemented in one module and likely reusable by another module."
    stable_when: "The capability is reused by another module, or the owner confirms it as a shared capability."
    module_reference_policy: "Module dossiers reference capability_key; capability facts remain in the capability index and docs."
  closeout_metadata_key: capability_map_update_status

capabilities:
  - key: development-resource-coordination
    name: 对话开发资源协调
    type: governance_protocol
    status: candidate
    origin: seed_repository
    owner_module: not_identified
    owner_component: ''
    related_app_keys: []
    summary: 新鲜设备状态与工作台CLI回读、按需环境及同用户跨项目重任务串行。
    implementation_paths:
    - docs/ai-coding/development-resources.md
    - ops/scripts/development-resources.py
    provided_contracts:
    - mawflow.development_resources.v1
    - mawflow.development_resource_policy.v1
    reusable_entrypoints:
    - python3 ops/scripts/development-resources.py check
    consumed_by_modules: []
    validation:
    - python3 ops/scripts/development-resources.py check
    last_verified_commit: ''
