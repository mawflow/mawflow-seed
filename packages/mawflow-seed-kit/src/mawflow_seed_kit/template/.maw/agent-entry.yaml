schema_version: 3
agent_entry:
  start_here: AI_START_HERE.md
  project_definition: .maw/project.yaml
  subprojects: .maw/subprojects.yaml
  code_sources: .maw/code-sources.yaml
  deployment_targets: .maw/deployments.yaml
  components: .maw/components.yaml
  modules: .maw/modules.yaml
  lifecycle: .maw/project-lifecycle.yaml
  local_overlay_root: .local/.maw
  managed_clone_root: .local/code-sources
  secret_policy: references_only
agent_protocol_version: 1
startup:
  recommended_order:
  - AI_START_HERE.md
  - .maw/agent-entry.yaml
  - .maw/agent-context.md
  - .maw/project.yaml
  - .maw/components.yaml
  - .maw/modules.yaml
  read_policy:
    docs_are_on_demand: true
    prompts_are_manual_only: true
    archive_is_not_default_context: true
facts:
  project: .maw/project.yaml
  subprojects: .maw/subprojects.yaml
  code_sources: .maw/code-sources.yaml
  deployment_targets: .maw/deployments.yaml
  components: .maw/components.yaml
  modules: .maw/modules.yaml
  runtime: .maw/app-runtime.yaml
  standards: .maw/standards.yaml
  project_governance: .maw/project-governance.yaml
protected_paths:
  never_commit:
  - .local/**
  - .maw/*.local.yaml
  - .ssh/**
  - artifacts/**
  manual_only:
  - prompts/**
  - docs/archive/**
execution_contract:
  before_editing:
  - identify module and owned paths
  - choose real validation commands
  closeout:
    release_policy: docs/ai-coding/release-closeout.md
    required_human_fields:
    - changes
    - validation
    - unverified
    - risks
    - release_impact
    stable_metadata:
    - task_lifecycle_status
    - resource_cleanup_status
  document_source_capture:
    schema: mawflow.document_source.v1
    policy: docs/ai-coding/document-source-capture.md
    directory: docs/intake
    tool: ops/scripts/capture-document-source.py
    read_only: deferred_read_only
    closeout_field: document_source_capture
    preferred_schema: mawflow.document_source.v4
    event_schema: mawflow.document_work_event.v3
    event_template: docs/intake/event-template.json
    record_action: record-event
    closeout_check: check-event
    automatic_triggers:
    - clarification
    - decision
    - correction
    - progress
    - blocked
    - verification
    - handoff
  project_governance:
    schema: mawflow.project_governance.v1
    source_schema: mawflow.document_source.v4
    policy: docs/ai-coding/project-governance.md
    command: mawflow project governance
    portable_tool: ops/scripts/manage-project-governance.py
    authority: confirmed_question_versions
    confirmation_does_not_grant_execution_permission: true
    consumption_requires_exact_context: true
    suite_policy: docs/ai-coding/governance-suite.md
    declaration: .maw/project-governance.yaml
    baseline_task: project_governance_baseline
    human_direct_maintenance: [create, edit, retire]
  update_notes:
    policy: docs/ai-coding/update-notes.md
    source: .maw/changes/*.yaml
    record_type: update_note
    command: python3 ops/scripts/generate-update-notes.py
    default_limit: 100
    trigger: verified_user_visible_change
    append_only: true
    read_only: deferred_read_only
    closeout_field: update_notes_status
  development_resources:
    device_policy_schema: mawflow.development_resource_policy.v1
    device_policy_location: user_home/.local/config/maw-development-resources.json
    host_capability: host.development_resources
    docker_runner: python3 ops/scripts/development-resources.py run --workload docker
      --execute -- <authorized-command>
    policy: docs/ai-coding/development-resources.md
    checker: python3 ops/scripts/development-resources.py check
    default_heavy_job_limit: 1
    coordination_scope: same_user_same_device
    checkpoints:
    - task_start
    - session_resume
    - service_start
    - before_heavy_job
    - after_heavy_job
    - milestone
    communication: capability_negotiated_cli_or_authorized_local_mcp
    unavailable_cli: project_files_fallback
    read_only_check_no_writes: true
  standards:
    policy: docs/standards/README.md
    catalog: .maw/standards.yaml
    checker: python3 ops/scripts/manage-project-standards.py check
    context: python3 ops/scripts/manage-project-standards.py context --phase <phase>
      --task-class <class> --task-kind <kind>
    read_policy: catalog_then_selected_authority_only
    authorization_granted: false
    legacy_missing: not_adopted_no_development_block
    execution_policy: docs/standards/execution-protocol.md
    execution_protocol: 1
    plan: python3 ops/scripts/manage-project-standards.py plan-task --input <task-snapshot>
    report: python3 ops/scripts/manage-project-standards.py report-task --input <task-snapshot>
  task_lifecycle:
    policy: docs/ai-coding/task-lifecycle.md
    schema: mawflow.task_lifecycle.v1
    snapshot_extension: mawflow.standard_task_snapshot.v1.lifecycle
    checker: python3 ops/scripts/manage-project-standards.py validate-task --input
      <task-snapshot>
    stages:
    - scoped
    - preparing
    - executing
    - verifying
    - closing
    - ended
    closeout_fields:
    - task_lifecycle_status
    - resource_cleanup_status
    existing_authorization_persists: true
    task_master_unchanged: true
    read_only_no_project_writes: true
    live_cleanup_enforcement: executor_capability_required
    automatic_cleanup_without_receipt: pending_automatic
    preferred_protocol_revision: 2
  browser_connection:
    policy: docs/ai-coding/browser-connection.md
    entry_selection: user_specified_else_healthy_official
    custom_proxy: confirmed_runtime_need_only
    js_reset_is_mcp_reload: false
    runtime_verified_by: fresh_discovery_open_read_click_reload_screenshot
    machine_values: local_only
task_routes:
  configuration_repair:
  - docs/ai-instructions/instructions/configuration-repair.md
  resource_libraries:
  - docs/ai-coding/workspace-libraries.md
  development:
  - docs/README.md
  review:
  - docs/README.md
  delivery:
  - MAWFLOW_CLI.md
  governance:
  - docs/ai-coding/project-governance.md
  - docs/ai-coding/governance-suite.md
  - docs/standards/README.md
  - PROJECT_COMMANDS.md
  standards:
  - docs/standards/README.md
  - .maw/standards.yaml
  browser_automation:
  - docs/ai-coding/browser-connection.md
tool_adapters:
  codex:
    file: AGENTS.md
    loader: instructions
    status: supported
  claude:
    file: CLAUDE.md
    loader: import
    status: supported
  gemini:
    file: GEMINI.md
    loader: import
    status: supported
  cursor:
    file: AGENTS.md
    loader: instructions
    status: supported
  generic_ai:
    file: AI_START_HERE.md
    loader: manual
    status: supported
  chatgpt_web:
    file: CHATGPT.md
    loader: repository_links
    status: supported
tool_preferences:
  rtk: optional_with_native_fallback
  mcp: optional
  skills: optional
git_policy:
  commit: project_policy
  push: project_policy
  mirror: project_policy
