schema_version: 1
upgrade_key: 20261010-development-resource-coordination
title: 对话开发资源预算与本机工作台持续通信
risk_level: T2
status: active
summary:
  - Agent 开工和阶段检查消费新鲜资源及 MAWflow CLI/工作台状态，离线回退项目文件。
  - 工作台统一选择本机或已有远程 Docker，所有采用规范的本机项目消费同一设备策略。
  - 同一设备同一用户的项目与工作树共用一个受管重任务名额；服务按需复用。
source_template_files:
  - docs/ai-coding/development-resources.md
  - docs/capabilities/development-resource-coordination.md
  - ops/scripts/development-resources.py
  - .maw/agent-entry.yaml
  - .maw/agent-rules.yaml
  - .maw/agent-context.md
  - AI_START_HERE.md
  - AGENTS.md
  - docs/ai-coding/README.md
  - docs/template-migrations/20261010-development-resource-coordination.md
target_project_policy:
  upgrade_mode: audit_first_then_incremental_merge
  preserve_target_facts: true
  protect: [README.md, code/, app_key, release configuration, repository mappings, real secrets, .local/, module dossiers]
  forbidden:
    - 将来源机器的性能采样、目录或预算复制为项目共享默认配置
    - 自动安装升级 Host、启动停止业务服务或扩大写入发布授权
    - 把候选实现、部分采用或 CLI 存在冒充公共发行、全量升级或工作台健康
validation:
  - git diff --check
  - python3 -m pytest -q tests/test_development_resources.py tests/test_agent_portability.py
  - bash ops/scripts/check-ai-framework-consistency.sh
  - bash ops/scripts/check-local-boundary.sh
propagation:
  migration_note: docs/template-migrations/20261010-development-resource-coordination.md
