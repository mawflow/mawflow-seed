schema_version: 1
upgrade_key: 20261022-codex-browser-connection
title: Codex浏览器连接与恢复经验
risk_level: T2
status: active
summary:
  - 官方健康入口优先，用户明确指定入口优先于默认策略。
  - 区分工具加载、发现、原生连接、运行时网络和页面控制，修复后执行真实页面验收。
  - 保留官方启动上下文及转发白名单，JS重置不替代MCP服务重连。
source_template_files:
  - docs/ai-coding/browser-connection.md
  - docs/ai-coding/README.md
  - docs/template-migrations/20261022-codex-browser-connection.md
  - .maw/agent-entry.yaml
  - .maw/agent-rules.yaml
  - AGENTS.md
  - AI_START_HERE.md
  - CLAUDE.md
  - GEMINI.md
  - CHATGPT.md
target_project_policy:
  upgrade_mode: audit_first_then_incremental_merge
  preserve_target_facts: true
  protect: [README.md, code/, app_key, release configuration, repository mappings, real secrets, .local/, module dossiers, existing intake records, user browser entry preferences]
  forbidden:
    - 安装或复制本机代理参数、连接上下文值、补丁及浏览器数据
    - 覆盖客户端自动生成配置、官方可信登记或安全策略
    - 未经独立复验宣称已修复或跨项目已采用
validation:
  - python3 -m pytest -q tests/test_browser_connection_distribution.py tests/test_agent_portability.py
  - python3 ops/scripts/check-agent-portability.py --check-distribution
  - git diff --check
  - bash ops/scripts/check-ai-framework-consistency.sh
  - bash ops/scripts/check-local-boundary.sh
propagation:
  migration_note: docs/template-migrations/20261022-codex-browser-connection.md
  prompt: prompts/codex/template-upgrade-prompts/20261022-codex-browser-connection-prompt.md
